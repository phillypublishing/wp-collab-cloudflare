name: WordPress plugin release

# A plugin Version header bump on main is the release signal. Publication is a
# resumable draft transaction for the same provenance-verified artifact as CI.

on:
  push:
    branches:
      - main
    paths:
      - 'plugin/wp-collab-cf/wp-collab-cf.php'

permissions:
  contents: read

concurrency:
  group: wp-plugin-release
  queue: max
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect plugin Version header change
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/plugin-release.mjs detect

      - name: Set up Node.js
        if: steps.version.outputs.release == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/wp-collab-cf/package-lock.json

      - name: Install plugin build dependencies
        if: steps.version.outputs.release == 'true'
        working-directory: plugin/wp-collab-cf
        run: npm ci

      - name: Test plugin
        if: steps.version.outputs.release == 'true'
        working-directory: plugin/wp-collab-cf
        run: npm test

      - name: Audit production dependencies
        if: steps.version.outputs.release == 'true'
        working-directory: plugin/wp-collab-cf
        run: npm audit --omit=dev --audit-level=high

      - name: Lint plugin PHP
        if: steps.version.outputs.release == 'true'
        working-directory: plugin/wp-collab-cf
        run: |
          set -euo pipefail
          php -l wp-collab-cf.php
          compatibility_modules="$(mktemp)"
          trap 'rm -f "$compatibility_modules"' EXIT
          find includes/compatibility -type f -name '*.php' -print0 > "$compatibility_modules"
          test -s "$compatibility_modules"
          xargs -0 -n1 php -l < "$compatibility_modules"

      - name: Test plugin PHP diagnostics
        if: steps.version.outputs.release == 'true'
        working-directory: plugin/wp-collab-cf
        run: |
          php test/rtc-diagnostics.php
          php test/compatibility-adapters.php
          php test/compatibility-version-policy.php absent
          php test/compatibility-version-policy.php mismatch
          php test/compatibility-version-policy.php news-mismatch
          php test/compatibility-version-policy.php news-missing
          php test/compatibility-version-policy.php video-mismatch
          php test/compatibility-version-policy.php video-missing
          php test/compatibility-version-policy.php local-mismatch
          php test/compatibility-version-policy.php local-missing

      - name: Build and verify release assets
        if: steps.version.outputs.release == 'true'
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/plugin-release
          PLUGIN_ARTIFACT_ALLOW_DIRTY: 0
        run: ./scripts/build-plugin-artifact.sh "${ARTIFACT_DIR}"

      - name: Lint generated plugin metadata
        if: steps.version.outputs.release == 'true'
        run: php -l plugin/wp-collab-cf/build/index.asset.php

      - name: Publish GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/plugin-release
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/plugin-release.mjs publish "${ARTIFACT_DIR}"
