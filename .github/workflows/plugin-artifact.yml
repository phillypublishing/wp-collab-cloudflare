name: WordPress plugin artifact

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/plugin-artifact.yml'
      - 'plugin/wp-collab-cf/**'
      - 'scripts/build-plugin-artifact.sh'
      - 'tests/plugin-artifact.test.sh'

permissions:
  contents: read

concurrency:
  group: plugin-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/wp-collab-cf/package-lock.json

      - name: Install dependencies
        working-directory: plugin/wp-collab-cf
        run: npm ci

      - name: Test plugin
        working-directory: plugin/wp-collab-cf
        run: npm test

      - name: Audit production dependencies
        working-directory: plugin/wp-collab-cf
        run: npm audit --omit=dev --audit-level=high

      - name: Lint plugin PHP
        working-directory: plugin/wp-collab-cf
        run: php -l wp-collab-cf.php

      - name: Test plugin PHP diagnostics
        working-directory: plugin/wp-collab-cf
        run: php test/rtc-diagnostics.php

      - name: Build and verify reproducible artifact
        env:
          PLUGIN_ARTIFACT_ALLOW_DIRTY: 0
        run: ./tests/plugin-artifact.test.sh "${RUNNER_TEMP}/plugin-artifact"

      - name: Lint generated plugin metadata
        run: php -l plugin/wp-collab-cf/build/index.asset.php

      - name: Upload plugin artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wp-collab-cf-${{ github.sha }}
          path: |
            ${{ runner.temp }}/plugin-artifact/*.zip
            ${{ runner.temp }}/plugin-artifact/*.sha256
            ${{ runner.temp }}/plugin-artifact/plugin-artifact-manifest.json
          if-no-files-found: error
          retention-days: 30
